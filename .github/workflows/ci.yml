name: Pondok OS CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build

  migration-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - run: |
          if [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Supabase secrets are not configured; migration check skipped."
            exit 0
          fi
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push --dry-run --linked --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

  database-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Start disposable Supabase
        run: supabase start
      - name: Apply all migrations from scratch
        run: supabase db reset --local --yes
      - name: Run RLS matrix
        run: supabase test db --local
      - name: Install application dependencies
        run: npm ci
      - name: Install Chromium for E2E
        run: npx playwright install --with-deps chromium
      - name: Export local Supabase credentials
        run: |
          supabase status -o env > /tmp/supabase.env
          source /tmp/supabase.env
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "E2E_EMAIL=e2e-active@example.test"
            echo "E2E_PASSWORD=Local-E2E-Password-2026"
            echo "PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000"
          } >> "$GITHUB_ENV"
      - name: Seed active E2E user
        run: npm run e2e:seed
      - name: Start application
        run: |
          npm run dev -- --hostname 127.0.0.1 --port 3000 > /tmp/idaroh-next.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/login > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/idaroh-next.log
          exit 1
      - name: Run browser E2E
        run: |
          if ! npm run test:e2e; then
            echo "----- Next.js server log -----"
            cat /tmp/idaroh-next.log
            exit 1
          fi
      - name: Stop disposable Supabase
        if: always()
        run: supabase stop --no-backup
